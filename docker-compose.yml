services:
  order-api:
    build:
      context: .
      dockerfile: OrderApi/Docker/Dockerfile
    ports:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - product-api
  product-api:
    build:
      context: .
      dockerfile: ProductApi/Docker/Dockerfile
    ports:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

networks:
  default:
    name: microservices-network