services:
  order-api:
    build:
      context: .
      dockerfile: OrderApi/Docker/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - product-api

  product-api:
    build:
      context: .
      dockerfile: ProductApi/Docker/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

networks:
  default:
    name: microservices-network